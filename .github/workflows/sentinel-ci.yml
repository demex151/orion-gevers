name: GEVER Sentinel CI

on:
  push:
    branches:
      - feat/gever-sentinel-audio
      - fix/orion-speechrecognition-sentinel
  pull_request:
    branches:
      - fix/single-controller-visual-state

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy sounddevice SpeechRecognition
      - name: Run sentinel/session tests
        run: |
          python -m pytest \
            tests/test_clap.py \
            tests/test_wakeword.py \
            tests/test_orion_phrase_engine.py \
            tests/test_sentinel.py \
            tests/test_session.py \
            tests/test_close_commands.py \
            tests/test_conversation_audio.py \
            tests/test_listener_bounds.py \
            tests/test_speech_director.py -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run session unit tests
        run: node --test src/sessionFlow.test.js src/sessionClient.test.js src/legacyVisualState.test.js src/audioPlayback.test.js
      - name: Build frontend
        run: npm run build
